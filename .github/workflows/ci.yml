name: CI
run-name: Artifact exit workaround proof
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  artifact-exit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare tiny native fixture and verifier
        shell: bash
        run: |
          mkdir -p proof-fixture
          cd proof-fixture
          printf '#!/bin/sh\nexit 0\n' > fixture-bridge
          cp fixture-bridge buzzodz
          chmod +x fixture-bridge buzzodz
          git rev-parse HEAD > revision
          sha256sum fixture-bridge buzzodz > SHA256SUMS
          tar -cf ../browser-fixture.tar fixture-bridge buzzodz revision SHA256SUMS
          cat > "$RUNNER_TEMP/verify-fixture.sh" <<'VERIFY'
          #!/bin/bash
          set -euo pipefail
          test -n "$FIXTURE_DOWNLOAD_PATH"
          cd "$FIXTURE_DIR"
          tar -xf browser-fixture.tar
          test "$(cat revision)" = "$(git rev-parse HEAD)"
          sha256sum --check SHA256SUMS
          test -x fixture-bridge
          test -x buzzodz
          VERIFY
          printf 'setInterval(() => {}, 1000);\n' > "$RUNNER_TEMP/artifact-keepalive.cjs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: artifact-exit-proof
          path: browser-fixture.tar
          retention-days: 1
      - name: Normal download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        id: normal
        timeout-minutes: 1
        continue-on-error: true
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          merge-multiple: true
          path: normal
      - name: Verify normal completion
        env:
          FIXTURE_DOWNLOAD_PATH: ${{ steps.normal.outputs.download-path }}
          FIXTURE_DIR: normal
          OUTCOME: ${{ steps.normal.outcome }}
        run: |
          test "$OUTCOME" = success
          bash "$RUNNER_TEMP/verify-fixture.sh"
      - name: Successful download with lingering Node handle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        id: lingering
        timeout-minutes: 1
        continue-on-error: true
        env:
          NODE_OPTIONS: --require ${{ runner.temp }}/artifact-keepalive.cjs
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          merge-multiple: true
          path: lingering
      - name: Verify timeout retains successful download output
        env:
          FIXTURE_DOWNLOAD_PATH: ${{ steps.lingering.outputs.download-path }}
          FIXTURE_DIR: lingering
          OUTCOME: ${{ steps.lingering.outcome }}
        run: |
          echo "Timed-out action outcome: $OUTCOME"
          test "$OUTCOME" = failure
          bash "$RUNNER_TEMP/verify-fixture.sh"
      - name: Missing artifact with stale valid files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        id: missing
        timeout-minutes: 1
        continue-on-error: true
        with:
          artifact-ids: '0'
          merge-multiple: true
          path: normal
      - name: Verify failed download is rejected despite stale files
        env:
          FIXTURE_DOWNLOAD_PATH: ${{ steps.missing.outputs.download-path }}
          FIXTURE_DIR: normal
          OUTCOME: ${{ steps.missing.outcome }}
        run: |
          test "$OUTCOME" = failure
          test -z "$FIXTURE_DOWNLOAD_PATH"
          if bash "$RUNNER_TEMP/verify-fixture.sh"; then
            echo 'ERROR: accepted failed download'
            exit 1
          fi
      - name: Verify corrupted fixture is rejected despite completion output
        env:
          FIXTURE_DOWNLOAD_PATH: ${{ steps.normal.outputs.download-path }}
          FIXTURE_DIR: normal
        run: |
          printf 'corrupt\n' > normal/fixture-bridge
          tar -cf normal/browser-fixture.tar -C normal fixture-bridge buzzodz revision SHA256SUMS
          if bash "$RUNNER_TEMP/verify-fixture.sh"; then
            echo 'ERROR: accepted checksum mismatch'
            exit 1
          fi
          echo 'Normal download and post-success timeout accepted; failed download and corruption rejected.' >> "$GITHUB_STEP_SUMMARY"
