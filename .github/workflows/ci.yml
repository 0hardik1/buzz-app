          VARIANCE_TESTS
      - name: Compare six fresh executions on one runner
        run: ./bin/node "$RUNNER_TEMP/variance-driver.mjs"
      - name: Comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: same-runner-browser-variance
          path: ${{ runner.temp }}/variance-evidence
          retention-days: 7
