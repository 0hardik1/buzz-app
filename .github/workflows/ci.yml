name: CI
run-name: CI proof — same-runner browser variance
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-variance-${{ github.run_id }}
  cancel-in-progress: false
env:
  CI: "true"
jobs:
  browser:
    name: "Same runner: baseline, density, split, split, density, baseline"
    runs-on:
      group: buzz-runners
      labels: buzz-ubuntu-x64-8core
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    env:
      HOME: /root
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 5b5f804f299f2d7166549b9989bbb50b7f5dacf3
      - name: Trust this container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
          browser-engine: webkit
      - name: Fetch immutable candidate revisions
        run: git fetch --no-tags --depth=1 origin c589ccf1bb39a82eea50700969fb0a0e91468b58 5d0ede748e2a28374b756ec9dc5f25d9ba1a0ca7
      - name: Prepare fixed workload and diagnostics
        run: |-
          cat > "$RUNNER_TEMP/variance-driver.mjs" <<'VARIANCE_DRIVER'
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawn, execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { performance } from 'node:perf_hooks';

          const root = process.cwd();
          const output = path.join(process.env.RUNNER_TEMP, 'variance-evidence');
          fs.mkdirSync(output, { recursive: true });
          const read = (name) => { try { return fs.readFileSync(name, 'utf8'); } catch { return null; } };
          const command = (bin, args) => execFileSync(bin, args, { encoding: 'utf8' });
          const snapshot = () => ({
            time: new Date().toISOString(),
            cpu: read('/proc/stat'), memory: read('/proc/meminfo'),
            cpuInfo: read('/proc/cpuinfo'),
            pressure: Object.fromEntries(['cpu', 'memory', 'io'].map(k => [k, read(`/proc/pressure/${k}`)])),
            cgroup: Object.fromEntries(['cpu.stat', 'cpu.max', 'cpu.weight', 'cpuset.cpus.effective', 'memory.events', 'memory.current', 'io.stat'].map(k => [k, read(`/sys/fs/cgroup/${k}`)])),
          });
          const variants = {
            baseline: { sha: '5b5f804f299f2d7166549b9989bbb50b7f5dacf3', workers: 2 },
            density: { sha: 'c589ccf1bb39a82eea50700969fb0a0e91468b58', workers: 3 },
            split: { sha: '5d0ede748e2a28374b756ec9dc5f25d9ba1a0ca7', workers: 2 },
          };
          const order = ['baseline', 'density', 'split', 'split', 'density', 'baseline'];
          fs.writeFileSync(path.join(output, 'design.json'), JSON.stringify({variants, order, selection: '111 original WebKit shard-4 cases; fixed identities; no sharding', limits: 'Single machine and workload; no whole-CI or population estimate'}, null, 2));
          fs.writeFileSync(path.join(output, 'machine.json'), JSON.stringify({lscpu: command('lscpu', ['--json']), kernel: command('uname', ['-a']), initial: snapshot()}, null, 2));
          const testList = path.join(process.env.RUNNER_TEMP, 'variance-test-list.txt');
          const expected = fs.readFileSync(testList, 'utf8').trim().split('\n').sort();
          function identities(report) {
            const result = [];
            function visit(suites, parents = []) {
              for (const suite of suites) {
                const titles = [...parents, suite.title];
                for (const spec of suite.specs ?? []) result.push(['[webkit]', spec.file, ...titles.slice(1), spec.title].join(' › '));
                visit(suite.suites ?? [], titles);
              }
            }
            visit(report.suites);
            return result.sort();
          }
          async function run(bin, args, env, log) {
            const fd = fs.openSync(log, 'w');
            try {
              const child = spawn(bin, args, { cwd: root, env, stdio: ['ignore', fd, fd] });
              return await new Promise((resolve, reject) => { child.once('error', reject); child.once('exit', (code, signal) => resolve({code, signal})); });
            } finally { fs.closeSync(fd); }
          }
          for (const [index, name] of order.entries()) {
            const variant = variants[name];
            command('git', ['checkout', '--detach', variant.sha]);
            if (command('git', ['rev-parse', 'HEAD']).trim() !== variant.sha) throw Error('Source mismatch');
            if (command('git', ['status', '--porcelain', '--untracked-files=no']).trim()) throw Error('Tracked worktree is dirty');
            const dir = path.join(output, `${index + 1}-${name}`);
            fs.mkdirSync(dir);
            const env = {...process.env, BUZZ_BROWSER_WORKERS: String(variant.workers), BUZZ_BROWSER_NATIVE_TESTS: name === 'split' ? 'exclude' : 'all', PLAYWRIGHT_JSON_OUTPUT_FILE: path.join(dir, 'discovery.json')};
            const args = ['exec', 'playwright', 'test', '--config', 'tests/browser/playwright.ci.config.mjs', '--project', 'webkit', '--no-deps', `--test-list=${testList}`, `--workers=${variant.workers}`, '--reporter=list,json'];
            const discovery = await run('./bin/pnpm', [...args, '--list'], env, path.join(dir, 'discovery.log'));
            if (discovery.code !== 0 || JSON.stringify(identities(JSON.parse(fs.readFileSync(env.PLAYWRIGHT_JSON_OUTPUT_FILE, 'utf8')))) !== JSON.stringify(expected)) throw Error(`Selection mismatch: ${name}`);
            // Fixed CPU work before tests, never concurrently with the measured workload.
            const buffer = Buffer.alloc(1024 * 1024, 37);
            const calibration = [];
            for (let trial = 0; trial < 4; trial++) {
              const begin = performance.now();
              for (let i = 0; i < 1024; i++) createHash('sha256').update(buffer).digest();
              calibration.push(performance.now() - begin);
            }
            fs.writeFileSync(path.join(dir, 'before.json'), JSON.stringify({snapshot: snapshot(), sha: variant.sha, workers: variant.workers, sha256GiBMilliseconds: calibration}, null, 2));
            const samplePath = path.join(dir, 'resources.jsonl');
            const sample = () => fs.appendFileSync(samplePath, JSON.stringify(snapshot()) + '\n');
            sample();
            const sampler = setInterval(sample, 2000);
            const begin = performance.now();
            console.log(`Starting ${index + 1}/6 ${name} ${variant.sha} workers=${variant.workers}`);
            let result;
            try {
              result = await run('./bin/pnpm', args, {...env, PLAYWRIGHT_JSON_OUTPUT_FILE: path.join(dir, 'report.json')}, path.join(dir, 'tests.log'));
            } finally { clearInterval(sampler); sample(); }
            const elapsedMs = performance.now() - begin;
            fs.writeFileSync(path.join(dir, 'result.json'), JSON.stringify({name, ...variant, ...result, elapsedMs, after: snapshot()}, null, 2));
            const report = JSON.parse(fs.readFileSync(path.join(dir, 'report.json'), 'utf8'));
            if (JSON.stringify(identities(report)) !== JSON.stringify(expected)) throw Error('Execution coverage mismatch');
            console.log(JSON.stringify({index: index + 1, name, ...result, elapsedMs, stats: report.stats}));
            if (result.code !== 0) throw Error(`Stopping after failed pass ${name}; evidence preserved, no retries`);
          }

          VARIANCE_DRIVER
          cat > "$RUNNER_TEMP/variance-test-list.txt" <<'VARIANCE_TESTS'
          [webkit] › navigation-group-icons.spec.mjs › group icons resolve custom media without overlapping labels, and the move dialog fits narrow widths
          [webkit] › navigation-group-icons.spec.mjs › section labels fade on overflow and recover when widened
          [webkit] › navigation-group-order.spec.mjs › dragging a group header moves the whole group, keeps its state, and persists
          [webkit] › navigation-group-order.spec.mjs › group move recovery keeps keyboard focus on the group header
          [webkit] › navigation-group-order.spec.mjs › saved groups accept gap drops in both directions
          [webkit] › navigation-group-order.spec.mjs › group landing edge follows list order when text size changes during a drag
          [webkit] › navigation-group-rename.spec.mjs › editing a saved group's name persists and keeps its channels
          [webkit] › navigation-group-rename.spec.mjs › section emoji edits are centered, keyboard-safe, independently removable and persistent
          [webkit] › navigation-join.spec.mjs › successful community setup navigates from Primary Messages and restores both visits
          [webkit] › navigation-join.spec.mjs › successful community setup navigates from Personal space Messages and restores both visits
          [webkit] › navigation-join.spec.mjs › Join a community is a visit: Go back closes it, Go forward reopens it with the typed address, Close retires it
          [webkit] › navigation-leak.spec.mjs › Settings → Close releases the unmounted Settings DOM
          [webkit] › navigation-mute-read.spec.mjs › channel menu mute/read persist without selecting the row; failed mute remains retryable
          [webkit] › navigation-mute-read.spec.mjs › muted bell stays visible while pressing an unselected channel
          [webkit] › navigation-repairs.spec.mjs › Back restores Personal space without inheriting the active community
          [webkit] › navigation-repairs.spec.mjs › keyboard Retry keeps focus when the retry fails in place
          [webkit] › navigation-repairs.spec.mjs › keyboard Retry hands off focus while reconnecting a failed Messages tab opening
          [webkit] › navigation-repairs.spec.mjs › a refused account is explained once, as access
          [webkit] › navigation-repairs.spec.mjs › Skip to content focuses main without adding a visit or dropping Back
          [webkit] › navigation-repairs.spec.mjs › An edited navigation hash opens its destination and survives reload and Back
          [webkit] › navigation-repairs.spec.mjs › malformed navigation addresses fail explicitly on cold and warm entry
          [webkit] › navigation-repairs.spec.mjs › page status :has() rules keep :has() on their subject
