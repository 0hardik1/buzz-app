# Temporary worker-count comparison on balanced shards; not a production workflow.
name: CI
run-name: Balanced browser workers / ${{ inputs.repetition }}
on:
  workflow_dispatch:
    inputs:
      repetition:
        description: Comparison identifier
        required: true
        type: string
        default: "1"
permissions:
  contents: read
concurrency:
  group: browser-workers-${{ github.run_id }}
  cancel-in-progress: false
env:
  CI: "true"
  CARGO_TERM_COLOR: always
jobs:
  browser_fixture:
    name: Native browser fixture
    runs-on:
      group: buzz-runners
      labels: buzz-ubuntu-x64-8core
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.fixture-upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: be7457b082ea7ecc06ac14feec540e7694857984
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: browser-fixture
          save-if: false
      - name: Build native browser fixture
        timeout-minutes: 8
        run: ./bin/cargo build --locked -p buzzodz-plugins --example fixture-bridge --bin buzzodz --target-dir target/browser-fixture
      - name: Package same-revision native fixture
        run: |
          mkdir -p target/browser-artifact
          cp target/browser-fixture/debug/examples/fixture-bridge target/browser-fixture/debug/buzzodz target/browser-artifact/
          git rev-parse HEAD > target/browser-artifact/revision
          cd target/browser-artifact
          sha256sum fixture-bridge buzzodz > SHA256SUMS
          tar -cf ../browser-fixture.tar fixture-bridge buzzodz revision SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: fixture-upload
        with:
          name: browser-fixture-${{ github.sha }}-${{ github.run_attempt }}
          path: target/browser-fixture.tar
          if-no-files-found: error
          retention-days: 7
  browser:
    name: Browser journeys (${{ matrix.case.engine }}, ${{ matrix.case.shard }}/${{ matrix.case.shards }}, ${{ matrix.workers }} workers)
    needs:
      - browser_fixture
    runs-on:
      group: buzz-runners
      labels: buzz-ubuntu-x64-8core
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    env:
      HOME: /root
      BUZZ_BROWSER_FIXTURE_DIR: target/ci-browser-fixture
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        workers: [2, 3]
        case:
          - engine: chromium
            shard: 6
            shards: 11
            weights: 115:111:116:106:131:157:138:89:80:175:161
          - engine: chromium
            shard: 8
            shards: 11
            weights: 115:111:116:106:131:157:138:89:80:175:161
          - engine: webkit
            shard: 14
            shards: 18
            weights: 45:70:70:58:58:50:60:69:97:133:74:57:71:61:60:129:140:73
          - engine: webkit
            shard: 3
            shards: 18
            weights: 45:70:70:58:58:50:60:69:97:133:74:57:71:61:60:129:140:73
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: be7457b082ea7ecc06ac14feec540e7694857984
      - name: Trust this container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
          browser-engine: ${{ matrix.case.engine }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.browser_fixture.outputs.artifact-id }}
          merge-multiple: true
          path: target/ci-browser-fixture
      - name: Verify native browser fixture
        run: |
          cd target/ci-browser-fixture
          tar -xf browser-fixture.tar
          test "$(cat revision)" = "$(git rev-parse HEAD)"
          sha256sum --check SHA256SUMS
          test -x fixture-bridge
          test -x buzzodz
      - name: Functional journeys
        env:
          PWTEST_SHARD_WEIGHTS: ${{ matrix.case.weights }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/browser/ci-report.json
        run: ./bin/node scripts/ci-test-report.mjs kind=playwright report=test-results/browser/ci-report.json evidence=test-results/browser/ci-timing.json title="Browser journeys (${{ matrix.case.engine }}, ${{ matrix.case.shard }}/${{ matrix.case.shards }}, ${{ matrix.workers }} workers)" -- ./bin/pnpm test:browser:ci --project ${{ matrix.case.engine }} --no-deps --workers=${{ matrix.workers }} --shard=${{ matrix.case.shard }}/${{ matrix.case.shards }} --reporter=list,json
      - name: Worker resource evidence
        if: always()
        run: |
          mkdir -p test-results/browser
          ./bin/node --input-type=module - <<'JS' > test-results/browser/worker-resources.json
          import { readFileSync, existsSync } from 'node:fs';
          const names = ['memory.peak', 'memory.max', 'memory.events', 'cpu.stat', 'cpu.max'];
          const values = Object.fromEntries(names.map(name => {
            const path = `/sys/fs/cgroup/${name}`;
            return [name, existsSync(path) ? readFileSync(path, 'utf8') : null];
          }));
          console.log(JSON.stringify(values, null, 2));
          JS
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-journeys-${{ matrix.case.engine }}-${{ matrix.case.shard }}-workers-${{ matrix.workers }}
          path: test-results/browser
          retention-days: 7
