name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Isolated discovery comparison
    runs-on:
      group: buzz-runners
      labels: buzz-ubuntu-x64-16core
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a62346e2e59f9554284222d75667320a83007b95
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Compare sequential and concurrent discovery
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = a62346e2e59f9554284222d75667320a83007b95
          test "$(git rev-parse HEAD^)" = 92fea89d9cd0df4542d3994ed1ed0ed96844ebce
          git show 92fea89d9cd0df4542d3994ed1ed0ed96844ebce:tests/integration/browser-ci.test.mjs > "$RUNNER_TEMP/sequential.mjs"
          cp tests/integration/browser-ci.test.mjs "$RUNNER_TEMP/concurrent.mjs"
          mkdir -p test-results/discovery-comparison
          round=0
          for variant in sequential concurrent concurrent sequential; do
            round=$((round + 1))
            cp "$RUNNER_TEMP/$variant.mjs" tests/integration/browser-ci.test.mjs
            echo "Round $round: $variant"
            ./bin/node --test --test-name-pattern='^Linux shards and macOS recording' --test-reporter=spec tests/integration/browser-ci.test.mjs 2>&1 | tee "test-results/discovery-comparison/$round-$variant.log"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: discovery-comparison
          path: test-results/discovery-comparison
          retention-days: 7
