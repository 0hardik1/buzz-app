          [webkit] › navigation-scroll-intent.spec.mjs › delayed sidebar restoration respects untouched viewport (cached startup: false)
          [webkit] › navigation-scroll-intent.spec.mjs › delayed sidebar restoration respects scrolled viewport (cached startup: false)
          [webkit] › navigation-scroll-intent.spec.mjs › delayed sidebar restoration respects returned to top viewport (cached startup: false)
          [webkit] › navigation-scroll-intent.spec.mjs › delayed sidebar restoration respects scroll event pending viewport (cached startup: false)
          [webkit] › navigation-scroll-intent.spec.mjs › delayed sidebar restoration respects untouched viewport (cached startup: true)
          [webkit] › navigation-scroll-intent.spec.mjs › delayed sidebar restoration respects scrolled viewport (cached startup: true)
          [webkit] › navigation-scroll-intent.spec.mjs › delayed sidebar restoration respects returned to top viewport (cached startup: true)
          [webkit] › navigation-scroll-intent.spec.mjs › delayed sidebar restoration respects scroll event pending viewport (cached startup: true)
          [webkit] › navigation-selection.spec.mjs › navigation menus do not highlight labels while message text and editors remain selectable
          [webkit] › navigation-selection.spec.mjs › context menus appear immediately and retain their source highlight through dismissal
          [webkit] › navigation-sidebar.spec.mjs › segmented selections slide but window resizing follows the selected tab immediately
          [webkit] › navigation-sidebar.spec.mjs › channel sidebar resizes from the full gutter and persists
          [webkit] › navigation-sidebar.spec.mjs › Channels opens the shared creation dialog
          [webkit] › navigation-sidebar.spec.mjs › hovering a sidebar row inks only that row, not its siblings
          [webkit] › navigation-sidebar.spec.mjs › channel navigation preserves sidebar DOM and group state
          [webkit] › navigation-sidebar.spec.mjs › navigation reveals the current sidebar entry without moving a visible one
          [webkit] › navigation-sidebar.spec.mjs › a reveal while the narrow drawer is closed runs when the drawer opens
          [webkit] › navigation-sidebar.spec.mjs › sidebar state survives Messages → Workflows → Messages
          [webkit] › navigation-sidebar.spec.mjs › sidebar state survives Messages → Settings → Messages
          [webkit] › navigation-sidebar.spec.mjs › sidebar state survives Messages → Back/Forward → Messages
          [webkit] › navigation-sidebar.spec.mjs › community picker stays available across pages and restores focus after joining
          [webkit] › navigation-sidebar.spec.mjs › sidebar view state does not leak across communities
          [webkit] › navigation-sidebar.spec.mjs › invalid saved sidebar fields fall back
          [webkit] › navigation-sidebar.spec.mjs › rail loads relay-owned image icons for inactive communities
          [webkit] › navigation-sidebar.spec.mjs › Messages reselects the latest sidebar channel and keyboard page search focuses main
          [webkit] › navigation-sidebar.spec.mjs › workspace heading resize › workspace controls stay inside the sidebar during resize and text scaling
          [webkit] › navigation-sorting.spec.mjs › keeps a stationary selected row visible while its neighbors exchange places
          [webkit] › navigation-sorting.spec.mjs › retargets an unfinished slide without jumping or losing focus
          [webkit] › navigation-sorting.spec.mjs › section sort applies immediately, rolls back on failure, and persists retry independently
          [webkit] › navigation-sorting.spec.mjs › retires Recent failures on A–Z and recovers selected ordering on retry
          [webkit] › navigation-sorting.spec.mjs › live sidebar motion: no-preference › slides a live reorder without replacing the focused row
          [webkit] › navigation-sorting.spec.mjs › live sidebar motion: reduce › slides a live reorder without replacing the focused row
          [webkit] › navigation-sorting.spec.mjs › live reduced-motion preference › updates an already-mounted list when reduced motion changes
          [webkit] › navigation-sorting.spec.mjs › nearby motion after layout changes › starts a nearby reorder at the live positions after reopening Team
          [webkit] › navigation-sorting.spec.mjs › nearby motion after layout changes › starts a nearby reorder at the live positions after interface text size
          [webkit] › navigation-sorting.spec.mjs › membership changes after layout changes › keeps retained rows still and fades additions/removals after reopening Team
          [webkit] › navigation-sorting.spec.mjs › membership changes after layout changes › keeps retained rows still and fades additions/removals after interface text size
          [webkit] › navigation-sorting.spec.mjs › distant channel motion › fades a distant jump at its endpoints without a long slide
          [webkit] › navigation-sorting.spec.mjs › cold sidebar presentation › reveals saved placement and Recent together without blocking the conversation
          [webkit] › navigation-sorting.spec.mjs › sorting with lifecycle visibility › archive and DM hide preserve Recent ordering through reload
          [webkit] › navigation.spec.mjs › Settings Back is reversible; explicit Close retires every section visit
          [webkit] › navigation.spec.mjs › a collapsible sidebar yields to narrow drawer styles during resize
          [webkit] › navigation.spec.mjs › a retired contributed Settings destination promptly reports the plugin turned off on Back
          [webkit] › navigation.spec.mjs › channel visits, toolbar, browser traversal and Settings sections share one history
          [webkit] › new-menu-layout.spec.mjs › the floating New button remains clickable with enlarged text
          [webkit] › notification-settings.spec.mjs › Notifications keeps settings separated and button labels contained at supported interface sizes
          [webkit] › own-video.spec.mjs › a stacked own video keeps its size without a byline
          [webkit] › personal-space-layout.spec.mjs › Personal space's Choose a community fits its pane and wheel-scrolls into view with enlarged text
          [webkit] › plugin-defaults.spec.mjs › cold app startup pins fresh defaults and activates opt-in Bestie setup
          [webkit] › plugin-defaults.spec.mjs › an untouched client profile keeps its previous plugin defaults across reopen
          [webkit] › plugin-defaults.spec.mjs › an existing profile can opt in to Bestie and keep its choice across reload
          [webkit] › plugin-defaults.spec.mjs › an existing profile keeps Reminders and Workflows until deliberately disabled
          [webkit] › plugin-defaults.spec.mjs › Membership action removes and restores the working Invite destination
          [webkit] › plugin-import.spec.mjs › scrolling a long update review keeps its heading readable
          [webkit] › plugin-import.spec.mjs › browser omits native import acquisition controls
          [webkit] › plugin-import.spec.mjs › Settings controls scale together and keep enlarged labels reachable
          [webkit] › plugin-import.spec.mjs › manual Git release-ref guidance stays readable across scale and themes
          [webkit] › plugin-import.spec.mjs › folder/Git preview selects the exact subfolder and preserves enabled state through updates
          [webkit] › plugin-import.spec.mjs › resizing over the catalog keeps focus in visible plugin details
