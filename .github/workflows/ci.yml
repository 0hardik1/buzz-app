# Temporary manual-dispatch experiment.
name: CI
run-name: Rust compile-once ABBA trial
on:
  workflow_dispatch: null
permissions:
  contents: read
env:
  CI: "true"
  CARGO_TERM_COLOR: always
jobs:
  native:
    if: github.repository == 'block/buzz-app' && github.ref == 'refs/heads/aepifano/ci-rust-compile-once-trial'
    name: Native Rust paired comparison
    runs-on:
      group: buzz-runners
      labels: buzz-ubuntu-x64-16core
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Separate harness from the measured checkout
        run: |
          harness="$RUNNER_TEMP/rust-trial-harness"
          mkdir -p "$harness"
          cp scripts/ci-rust-compile-once-trial.sh scripts/ci-rust-compile-once-audit.py scripts/ci-rust-cache-inventory.py "$harness"
          git checkout --detach a00c9017b59b5f5c3ed888a755d0329bf02c2135
          test "$(git rev-parse HEAD)" = a00c9017b59b5f5c3ed888a755d0329bf02c2135
          test -z "$(git status --porcelain)"
      - uses: ./.github/actions/setup
      - name: Tauri system libraries
        run: |
          # Azure package downloads can stall until the whole job expires:
          # https://github.com/actions/runner-images/issues/14594
          # Keep the image's official HTTPS archive and security fallbacks.
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus-daemon libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Install isolated pinned Rust toolchain
        run: |
          export RUSTUP_HOME="$RUNNER_TEMP/buzz-rustup"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          ./bin/rustup toolchain install
          ./bin/rustup default "$(./bin/rustup show active-toolchain | cut -d ' ' -f1)"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native
          save-if: "false"
        id: rust-cache
      - name: Inventory restored archive and require production cache hit
        env:
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          bash "$RUNNER_TEMP/rust-trial-harness/ci-rust-compile-once-trial.sh" restored
          if [[ "$RUST_CACHE_HIT" != true ]]; then
            echo "No exact production Rust cache match. Stopping the warm comparison."
            exit 1
          fi
      - name: Dependency policy
        run: ./bin/cargo-deny --locked check
      - name: Rust formatting
        run: ./bin/cargo fmt --all --check
      - name: Rust lint
        run: ./bin/cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Run ABBA from the same post-Clippy snapshot
        run: bash "$RUNNER_TEMP/rust-trial-harness/ci-rust-compile-once-trial.sh" compare
      - name: FI Builderlab build and grant tests
        env:
          BUZZ_BUILD_FEDERATED_IDENTITY_CONFIG: '{"version":1,"id":"ci-fi","identityOrigin":"https://identity.example.test","communityHosts":["relay.example.test"],"adapterBase":"https://identity.example.test/api/goose/nip-fa","apiBasePath":"/api/goose/"}'
          BUZZ_BUILDERLAB_URL: ""
        run: |
          ./bin/cargo test -p buzzodz-plugins --lib --locked
          ./bin/cargo test -p Buzz --lib --locked host_request
          ./bin/pnpm exec vite build
      - name: FI opt-out build and grant tests
        env:
          BUZZ_BUILD_FEDERATED_IDENTITY_CONFIG: ""
        run: |
          ./bin/cargo test -p buzzodz-plugins --lib --locked
          ./bin/cargo test -p Buzz --lib --locked host_request
      - name: Upload timing, coverage and cache inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-trial-evidence
          path: ${{ runner.temp }}/rust-trial-evidence
          if-no-files-found: warn
          retention-days: 3
