name: Datadog Vitest branch smoke
on:
  push:
    branches: [jameskraus/datadog-vitest-reporting]
permissions:
  contents: read
jobs:
  smoke:
    if: github.ref == 'refs/heads/jameskraus/datadog-vitest-reporting'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Start loopback intake with a dummy key
        id: datadog
        run: |
          python3 -u - <<'PYTHON' > "$RUNNER_TEMP/intake.log" 2>&1 &
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from pathlib import Path
          import gzip, os
          class Intake(BaseHTTPRequestHandler):
              def do_POST(self):
                  data = self.rfile.read(int(self.headers.get('Content-Length', 0)))
                  if self.headers.get('Content-Encoding') == 'gzip':
                      data = gzip.decompress(data)
                  if self.path == '/api/v2/citestcycle':
                      assert self.headers.get('dd-api-key') == '0' * 32
                      with (Path(os.environ['RUNNER_TEMP']) / 'test-events').open('ab') as f:
                          f.write(data)
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'{"data":{"attributes":{}}}')
          server = HTTPServer(('127.0.0.1', 8126), Intake)
          server.serve_forever()
          PYTHON
          curl --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8126/
          echo "api_key=00000000000000000000000000000000" >> "$GITHUB_OUTPUT"
      - name: Vitest shard
        env:
          # Bound contention between suites that sign and verify large fixtures.
          BUZZ_TEST_WORKERS: "2"
          DD_API_KEY: ${{ steps.datadog.outputs.api_key }}
          DD_CIVISIBILITY_AGENTLESS_ENABLED: ${{ steps.datadog.outputs.api_key != '' }}
          DD_SITE: localhost.invalid
          DD_CIVISIBILITY_AGENTLESS_URL: http://127.0.0.1:8126
          DD_CIVISIBILITY_GIT_UPLOAD_ENABLED: "false"
          DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
          DD_SERVICE: buzz-app
          DD_ENV: ci
          DD_TEST_SESSION_NAME: vitest
          # CI owns test selection and retries. Datadog only reports results.
          DD_CIVISIBILITY_ITR_ENABLED: "false"
          DD_CIVISIBILITY_FLAKY_RETRY_ENABLED: "false"
          DD_CIVISIBILITY_EARLY_FLAKE_DETECTION_ENABLED: "false"
          DD_TEST_MANAGEMENT_ENABLED: "false"
          DD_TEST_FAILED_TEST_REPLAY_ENABLED: "false"
          # Report from the Vitest coordinator so fixture subprocesses can run outside the checkout.
          DD_EXPERIMENTAL_TEST_OPT_VITEST_NO_WORKER_INIT: "true"
          NODE_OPTIONS: ${{ steps.datadog.outputs.api_key != '' && '--import dd-trace/register.js -r dd-trace/ci/init' || '' }}
        run: ./bin/node scripts/ci-test-report.mjs kind=vitest report=test-results/ci/vitest.json evidence=test-results/ci/vitest-timing.json title="Vitest smoke" -- ./bin/pnpm exec vitest run scripts/developer-settings.test.mjs src/bundled/codex/execution.test.ts --reporter=default --reporter=json --outputFile=test-results/ci/vitest.json
      - name: Verify emitted test events
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          report = json.loads(Path('test-results/ci/vitest.json').read_text())
          events = (Path(os.environ['RUNNER_TEMP']) / 'test-events').read_bytes()
          tests = [t['title'] for s in report['testResults'] for t in s['assertionResults']]
          assert len(tests) == report['numPassedTests'] == 6
          assert all(t.encode() in events for t in tests)
          print(f'Loopback intake received all {len(tests)} named tests.')
          PYTHON
